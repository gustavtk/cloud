      <g class="pill-content">
        <circle cx="6" cy="107" r="6.5" fill="#A3DCD4"/>
        <circle cx="22" cy="107" r="6.5" fill="#D094E5"/>
        <circle cx="38" cy="107" r="6.5" fill="#E8B89C"/>
        <text class="ft" x="58" y="115" font-size="23" font-weight="600" fill="#EDE7DE">We build, secure and manage websites.</text>
      </g>
    </g>
  </g>
    <g id="kicker" data-qa="text"><text id="kicker-line1" class="hl" x="80" y="236" font-size="50" font-weight="700" fill="#E8B89C" text-anchor="start" letter-spacing="-1">Your shop has a padlock.</text></g>
    <g id="headline" data-qa="text"><text id="headline-line1" class="hl" x="80" y="354" font-size="118" font-weight="700" fill="#EDE7DE" text-anchor="start" letter-spacing="-3">Does your</text><text id="headline-line2" class="hl" x="80" y="470" font-size="118" font-weight="700" fill="#A3DCD4" text-anchor="start" letter-spacing="-3">website?</text></g>
    <g id="support" data-qa="text"><text id="support-line1" class="ft" x="80" y="534" font-size="27" font-weight="400" fill="#EDE7DE" text-anchor="start" letter-spacing="0">New website or existing one, we help keep it safe</text><text id="support-line2" class="ft" x="80" y="572" font-size="27" font-weight="400" fill="#EDE7DE" text-anchor="start" letter-spacing="0">with protection, regular updates and backups.</text><text id="support-line3" class="ft" x="80" y="610" font-size="27" font-weight="400" fill="#EDE7DE" text-anchor="start" letter-spacing="0">And because we keep looking after it, help is</text><text id="support-line4" class="ft" x="80" y="648" font-size="27" font-weight="400" fill="#EDE7DE" text-anchor="start" letter-spacing="0">just a message away if anything goes wrong.</text></g>
    <g id="cta" data-qa="cta" data-flow="0" data-x="80" data-align="left">
    <g class="item" data-pill="38,12" transform="translate(118.00 0)">
      <rect class="pill-bg" x="-38.00" y="678" width="511.00" height="80" rx="40" fill="#A3DCD4" filter="url(#shadow-s)"/>
      <g class="pill-content" data-flow="22" data-x="0" data-align="left">
        <g class="item" transform="translate(0.00 0)"><text class="ft" x="0" y="728" font-size="28" font-weight="700" fill="#364442">Ask about website protection</text></g>
        <g class="item" transform="translate(405.00 0)"><circle cx="28" cy="718" r="28" fill="#025A4E"/><g transform="translate(14 704) scale(1.1666666666666667)" fill="none" stroke="#EDE7DE" stroke-width="2.2285714285714286" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g></g>
      </g>
    </g>
  </g></g>
  <g id="layer-contact"><g id="contact" data-qa="contact" data-flow="40" data-x="1520" data-align="right"><g class="item" id="contact-web" transform="translate(604.00 0)">
