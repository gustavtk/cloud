  <g id="layer-logo"><g id="logo" data-qa="logo"><rect id="logo-chip" x="80" y="82" width="280" height="74" rx="37" fill="#EDE7DE"/><text id="logo-placeholder" class="hl" x="104" y="132" font-size="40" fill="#025A4E" letter-spacing="-1">3ple Lift</text></g></g>
