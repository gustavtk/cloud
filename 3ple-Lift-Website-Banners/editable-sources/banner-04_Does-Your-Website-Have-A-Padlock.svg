    <circle cx="1043" cy="414" r="7.5" fill="#E8B89C"/>
    <circle cx="1067" cy="414" r="7.5" fill="#D094E5"/>
    <circle cx="1091" cy="414" r="7.5" fill="#A3DCD4"/>
