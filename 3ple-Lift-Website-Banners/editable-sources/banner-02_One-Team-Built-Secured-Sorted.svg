<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="banner-02" width="1600" height="900" viewBox="0 0 1600 900">
  <title>3ple Lift: One team. Built. Secured. Sorted.</title>
  <style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 700; src: url('fonts/BricolageGrotesque-Bold.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 400; src: url('fonts/Figtree-Regular.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 500; src: url('fonts/Figtree-Medium.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 600; src: url('fonts/Figtree-SemiBold.ttf'); }
  @font-face { font-family: 'Figtree'; font-weight: 700; src: url('fonts/Figtree-Bold.ttf'); }
  .hl { font-family: 'Bricolage Grotesque'; font-weight: 700; }
  .ft { font-family: 'Figtree'; }
</style>
  <defs>
  <filter id="blur-xl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="95"/></filter>
  <filter id="blur-l" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="blur-s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="shadow" x="-50%" y="-80%" width="200%" height="280%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#364442" flood-opacity="0.16"/></filter>
  <filter id="shadow-s" x="-50%" y="-100%" width="200%" height="320%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#364442" flood-opacity="0.16"/></filter>
  <filter id="shadow-dark" x="-60%" y="-150%" width="220%" height="420%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0b1f1c" flood-opacity="0.45"/></filter>
  <linearGradient id="g-hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3DCD4"/><stop offset="0.55" stop-color="#BDDFF9"/><stop offset="1" stop-color="#D094E5"/></linearGradient>
  <linearGradient id="g-warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8B89C"/><stop offset="1" stop-color="#D094E5"/></linearGradient>
  <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3DCD4"/><stop offset="0.5" stop-color="#D094E5"/><stop offset="1" stop-color="#E8B89C"/></linearGradient>
  <linearGradient id="g-ribbon-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A3DCD4" stop-opacity="0"/><stop offset="0.35" stop-color="#A3DCD4"/><stop offset="0.7" stop-color="#BDDFF9"/><stop offset="1" stop-color="#D094E5" stop-opacity="0.2"/></linearGradient>
  <linearGradient id="g-ribbon-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8B89C" stop-opacity="0.1"/><stop offset="0.5" stop-color="#E8B89C"/><stop offset="1" stop-color="#D094E5" stop-opacity="0.3"/></linearGradient>
</defs>
  <g id="layer-background"><rect id="base" width="1600" height="900" fill="#EDE7DE"/>
    <g filter="url(#blur-xl)"><ellipse cx="420" cy="450" rx="420" ry="360" fill="#BDDFF9" opacity="0.7"/><ellipse cx="1500" cy="120" rx="340" ry="220" fill="#A3DCD4" opacity="0.65"/><ellipse cx="1550" cy="760" rx="300" ry="260" fill="#D094E5" opacity="0.4"/><ellipse cx="-40" cy="820" rx="300" ry="200" fill="#E8B89C" opacity="0.5"/></g>
    <path d="M700 -60 C 760 220, 620 420, 780 640 S 900 980, 760 1000" fill="none" stroke="url(#g-ribbon-b)" stroke-width="120" opacity="0.28" filter="url(#blur-l)"/></g>
  <g id="layer-illustration" data-qa="illustration">
    <g id="venn" style="isolation:isolate">
      <circle id="venn-build" cx="292" cy="352" r="172" fill="#A3DCD4" opacity="0.62"/><circle id="venn-secure" cx="504" cy="352" r="172" fill="#D094E5" opacity="0.62"/><circle id="venn-manage" cx="398" cy="536" r="172" fill="#E8B89C" opacity="0.62"/>
    </g>
    <g id="venn-label-build">
        <circle cx="210" cy="234" r="26" fill="#FBF8F3" opacity="0.9"/>
        <g transform="translate(196 220) scale(1.1666666666666667)" fill="none" stroke="#025A4E" stroke-width="1.971428571428571" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.4 5.5l-2.8 13"/></g>
        <text class="hl" x="210" y="300" text-anchor="middle" font-size="38" fill="#025A4E" letter-spacing="-0.5">Build</text>
        <text class="ft" x="210" y="330" text-anchor="middle" font-size="19" font-weight="600" fill="#364442">New websites</text><text class="ft" x="210" y="354" text-anchor="middle" font-size="19" font-weight="600" fill="#364442">&amp; improvements</text>
      </g><g id="venn-label-secure">
        <circle cx="588" cy="234" r="26" fill="#FBF8F3" opacity="0.9"/>
        <g transform="translate(574 220) scale(1.1666666666666667)" fill="none" stroke="#025A4E" stroke-width="1.971428571428571" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.9-4.3-1.6-7.5-5.3-7.5-9.9V6z"/><path d="M8.6 12.2l2.4 2.4 4.6-4.8"/></g>
        <text class="hl" x="588" y="300" text-anchor="middle" font-size="38" fill="#025A4E" letter-spacing="-0.5">Secure</text>
        <text class="ft" x="588" y="330" text-anchor="middle" font-size="19" font-weight="600" fill="#364442">Protection</text><text class="ft" x="588" y="354" text-anchor="middle" font-size="19" font-weight="600" fill="#364442">&amp; backups</text>
      </g><g id="venn-label-manage">
        <circle cx="398" cy="544" r="26" fill="#FBF8F3" opacity="0.9"/>
        <g transform="translate(384 530) scale(1.1666666666666667)" fill="none" stroke="#025A4E" stroke-width="1.971428571428571" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></g>
        <text class="hl" x="398" y="610" text-anchor="middle" font-size="38" fill="#025A4E" letter-spacing="-0.5">Manage</text>
        <text class="ft" x="398" y="640" text-anchor="middle" font-size="19" font-weight="600" fill="#364442">Hosting, updates</text><text class="ft" x="398" y="664" text-anchor="middle" font-size="19" font-weight="600" fill="#364442">&amp; fixes</text>
      </g>
    <g id="venn-centre" filter="url(#shadow-s)">
      <circle cx="398" cy="414" r="58" fill="#025A4E"/>
      <text class="hl" x="398" y="408" text-anchor="middle" font-size="25" fill="#EDE7DE">One</text>
      <text class="hl" x="398" y="436" text-anchor="middle" font-size="25" fill="#EDE7DE">team</text>
    </g></g>
  <g id="layer-logo"><g id="logo" data-qa="logo"><text id="logo-placeholder" class="hl" x="80" y="124.56" font-size="44.800000000000004" fill="#025A4E" letter-spacing="-1">3ple Lift</text></g></g>
  <g id="layer-text">
    <g id="brand-statement" data-qa="statement" data-flow="0" data-x="830" data-align="left">
    <g class="item" data-pill="20,24" transform="translate(850.50 0)">
      <rect class="pill-bg" x="-20.50" y="118" width="519.50" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.62" stroke="#025A4E" stroke-opacity="0.14" stroke-width="1.5"/>
      <g class="pill-content">
        <circle cx="6" cy="145" r="6.5" fill="#A3DCD4"/>
        <circle cx="22" cy="145" r="6.5" fill="#D094E5"/>
        <circle cx="38" cy="145" r="6.5" fill="#E8B89C"/>
        <text class="ft" x="58" y="153" font-size="23" font-weight="600" fill="#025A4E">We build, secure and manage websites.</text>
      </g>
    </g>
  </g>
    <g id="headline" data-qa="text">
    <text id="headline-line1" class="hl" x="830" y="290" font-size="92" font-weight="700" fill="#025A4E" letter-spacing="-2.5">One team.</text>
    <g id="headline-line2" data-flow="26" data-x="830" data-align="left">
      <g class="item" transform="translate(830.00 0)">
      <rect class="highlight" data-hl-for="headline-built" data-pad="8" x="-8.00" y="360" width="232.50" height="30" rx="15" fill="#A3DCD4" opacity="0.85"/>
      <text id="headline-built" class="hl" x="0" y="382" font-size="92" font-weight="700" fill="#025A4E" letter-spacing="-2.5">Built.</text>
    </g>
      <g class="item" transform="translate(1072.50 0)">
      <rect class="highlight" data-hl-for="headline-secured" data-pad="8" x="-8.00" y="360" width="393.50" height="30" rx="15" fill="#D094E5" opacity="0.85"/>
      <text id="headline-secured" class="hl" x="0" y="382" font-size="92" font-weight="700" fill="#025A4E" letter-spacing="-2.5">Secured.</text>
    </g>
    </g>
    <g id="headline-line3" data-flow="0" data-x="830" data-align="left">
      <g class="item" transform="translate(830.00 0)">
      <rect class="highlight" data-hl-for="headline-sorted" data-pad="8" x="-8.00" y="452" width="329.00" height="30" rx="15" fill="#E8B89C" opacity="0.85"/>
      <text id="headline-sorted" class="hl" x="0" y="474" font-size="92" font-weight="700" fill="#025A4E" letter-spacing="-2.5">Sorted.</text>
    </g>
    </g>
  </g>
    <g id="support" data-qa="text"><text id="support-line1" class="ft" x="830" y="548" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">Stop chasing different people for design,</text><text id="support-line2" class="ft" x="830" y="588" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">hosting and fixes. We build your website,</text><text id="support-line3" class="ft" x="830" y="628" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">help keep it safe and look after it afterward.</text></g>
    <g id="cta" data-qa="cta" data-flow="0" data-x="830" data-align="left">
    <g class="item" data-pill="38,12" transform="translate(868.00 0)">
      <rect class="pill-bg" x="-38.00" y="656" width="336.00" height="80" rx="40" fill="#025A4E" filter="url(#shadow-s)"/>
      <g class="pill-content" data-flow="22" data-x="0" data-align="left">
        <g class="item" transform="translate(0.00 0)"><text class="ft" x="0" y="706" font-size="28" font-weight="700" fill="#EDE7DE">Talk to our team</text></g>
        <g class="item" transform="translate(230.00 0)"><circle cx="28" cy="696" r="28" fill="#A3DCD4"/><g transform="translate(14 682) scale(1.1666666666666667)" fill="none" stroke="#025A4E" stroke-width="2.2285714285714286" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g></g>
      </g>
    </g>
  </g></g>
  <g id="layer-contact"><g id="contact" data-qa="contact" data-flow="46" data-x="80" data-align="left"><g class="item" id="contact-web" transform="translate(80.00 0)">
        <circle cx="22" cy="790" r="22" fill="#FFFFFF" fill-opacity="0.75"/><g transform="translate(10 778) scale(1)" fill="none" stroke="#025A4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g>
        <text class="ft" x="56" y="798.5" font-size="24" font-weight="600" fill="#364442">3plelift.com</text>
      </g><g class="item" id="contact-whatsapp" transform="translate(312.00 0)">
        <circle cx="22" cy="790" r="22" fill="#FFFFFF" fill-opacity="0.75"/><g transform="translate(10 778) scale(1)" fill="none" stroke="#025A4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1 0 12 3.5z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></g>
        <text class="ft" x="56" y="798.5" font-size="24" font-weight="600" fill="#364442">WhatsApp: +233 26 463 6393</text>
      </g><g class="item" id="contact-email" transform="translate(739.00 0)">
        <circle cx="22" cy="790" r="22" fill="#FFFFFF" fill-opacity="0.75"/><g transform="translate(10 778) scale(1)" fill="none" stroke="#025A4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 6 8-6"/></g>
        <text class="ft" x="56" y="798.5" font-size="24" font-weight="600" fill="#364442">email@3plelift.com</text>
      </g></g></g>
</svg>
