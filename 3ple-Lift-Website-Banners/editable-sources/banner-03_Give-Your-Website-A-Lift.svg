    <g id="support" data-qa="text"><text id="support-line1" class="ft" x="80" y="470" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">Is your current website slow, outdated or hard to use?</text><text id="support-line2" class="ft" x="80" y="511" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">We’ll improve it, help keep it safe, and keep caring</text><text id="support-line3" class="ft" x="80" y="552" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">for it with updates, backups and fixes.</text></g>
