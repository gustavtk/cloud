    <g id="headline" data-qa="text"><text id="headline-line1" class="hl" x="80" y="282" font-size="112" font-weight="700" fill="#025A4E" text-anchor="start" letter-spacing="-2.5">We build it.</text><text id="headline-line2" class="hl" x="80" y="390" font-size="112" font-weight="700" fill="#025A4E" text-anchor="start" letter-spacing="-2.5">Then we stay.</text></g>
    <g id="brand-statement" data-qa="statement" data-flow="0" data-x="1520" data-align="right">
    <g class="item" data-pill="20,24" transform="translate(1021.00 0)">
      <rect class="pill-bg" x="-20.50" y="83" width="519.50" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.62" stroke="#025A4E" stroke-opacity="0.14" stroke-width="1.5"/>
      <g class="pill-content">
