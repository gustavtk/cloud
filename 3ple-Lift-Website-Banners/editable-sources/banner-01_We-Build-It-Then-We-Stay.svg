        <circle cx="22" cy="110" r="6.5" fill="#D094E5"/>
        <circle cx="38" cy="110" r="6.5" fill="#E8B89C"/>
        <text class="ft" x="58" y="118" font-size="23" font-weight="600" fill="#025A4E">We build, secure and manage websites.</text>
      </g>
    </g>
  </g>
    <g id="support" data-qa="text"><text id="support-line1" class="ft" x="80" y="470" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">Get a new website from a team that sticks with</text><text id="support-line2" class="ft" x="80" y="511" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">you after launch. We help keep it safe, take care</text><text id="support-line3" class="ft" x="80" y="552" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">of updates and fixes, and we’re just a message</text><text id="support-line4" class="ft" x="80" y="593" font-size="28" font-weight="400" fill="#364442" text-anchor="start" letter-spacing="0">away whenever you need help.</text></g>
